manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: dhruvinsh
      url-base: https://github.com/dhruvinsh
  projects:
    - name: zmk
      remote: urob
      # I think that this is a known good state of Urob, but Urob's repo at this state was
      # pointing to ZMK main, so I also have to somehow override the version of ZMK to v0.2.
      # Not sure if specifying @v0.2 in Github action does that.
      revision: v0.2
      import: app/west.yml
    
  self:
    path: config
